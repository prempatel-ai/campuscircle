services:
  api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src   # live-reload: edit code on your machine, container picks it up
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations
      - ./tests:/app/tests
    env_file:
      - .env
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://campuscircle_test:campuscircle_test@db_test:5432/campuscircle_test
    depends_on:
      - db
      - db_test

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: campuscircle
      POSTGRES_PASSWORD: campuscircle
      POSTGRES_DB: campuscircle
    ports:
      - "5432:5432"   # exposed so you can inspect the DB with a GUI tool (TablePlus, DBeaver, etc.)
    volumes:
      - campuscircle_pgdata:/var/lib/postgresql/data

  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: campuscircle_test
      POSTGRES_PASSWORD: campuscircle_test
      POSTGRES_DB: campuscircle_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  campuscircle_pgdata:

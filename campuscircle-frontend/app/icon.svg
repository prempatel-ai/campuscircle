<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F5233"/>
      <stop offset="100%" stop-color="#142617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#C58529"/>
    </linearGradient>
  </defs>

  <!-- Dark Collegiate Green Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />

  <!-- Outer Subtle Gold Ring -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />

  <!-- Bold Minimalist 'C' Monogram -->
  <path 
    d="M 355 165 C 320 120 260 110 205 135 C 145 162 110 225 110 290 C 110 360 155 415 220 430 C 275 442 335 415 365 370" 
    fill="none" 
    stroke="url(#goldGrad)" 
    stroke-width="52" 
    stroke-linecap="round" 
  />
</svg>
